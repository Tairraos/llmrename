<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LLM Rename — 视觉模型批量重命名</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>LLM Rename <span id="app-version" class="version-badge"></span></h1>
      <nav class="header-actions">
        <button id="btn-open-template" class="header-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" d="M19.25 3H4.75A2.755 2.755 0 0 0 2 5.75v10.5A2.755 2.755 0 0 0 4.75 19h3.71l2.69 2.485c.24.22.545.33.85.33s.61-.11.85-.33L15.54 19h3.71A2.755 2.755 0 0 0 22 16.25V5.75A2.755 2.755 0 0 0 19.25 3M13.5 14h-7v-1.5h7zm4-4.5h-11V8h11z" /></svg>
          模板设置</button>
        <button id="btn-open-model" class="header-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" fill-rule="evenodd" d="M22 8v1.5h-2v1.75h2v1.5h-2v1.75h2V16h-2v1.25A2.755 2.755 0 0 1 17.25 20h-.75v2H15v-2h-2.25v2h-1.5v-2H9v2H7.5v-2h-.75A2.755 2.755 0 0 1 4 17.25V16H2v-1.5h2v-1.75H2v-1.5h2V9.5H2V8h2V6.75A2.755 2.755 0 0 1 6.75 4h.75V2H9v2h2.25V2h1.5v2H15V2h1.5v2h.75A2.755 2.755 0 0 1 20 6.75V8zM8 16h8V8H8zm1.5-6.5h5v5h-5z" clip-rule="evenodd" /></svg>
          模型设置</button>
        <button id="btn-open-logs" class="header-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" fill-rule="evenodd" d="M21 5.75V7H3V5.75A2.755 2.755 0 0 1 5.75 3h12.5A2.755 2.755 0 0 1 21 5.75M3 18.25V8.5h18v9.75A2.755 2.755 0 0 1 18.25 21H5.75A2.755 2.755 0 0 1 3 18.25m4.78-.47l2.645-2.645a1.26 1.26 0 0 0 0-1.77L7.78 10.72l-1.06 1.06l2.47 2.47l-2.47 2.47zM12 17.5h5V16h-5z" clip-rule="evenodd" /></svg>
          操作日志</button>
      </nav>
    </header>

    <main class="app-main">
      <!-- ① 拖放 + 大模型调试台 -->
      <section class="card" data-block="drop">
        <div class="drop-console-row">
          <div id="drop-zone" class="drop-zone">
            <p class="drop-zone-title">拖入图片 / 文件夹</p>
            <p class="drop-zone-hint">窗口任意位置拖放均可</p>
            <p class="drop-zone-actions">
              <button id="btn-pick-files" type="button" class="secondary">选择图片</button>
              <button id="btn-pick-dir" type="button" class="secondary">选择文件夹</button>
            </p>
          </div>
          <pre id="console-view" class="console-view"><span class="c-dim">（大模型调试台：调用状态与流式输出会显示在这里）</span></pre>
        </div>
      </section>

      <!-- ② 待重命名列表 -->
      <section class="card" data-block="targets">
        <div class="row template-bar">
          <span class="hint">模板：</span>
          <code id="template-summary">（未设置）</code>
          <button id="btn-ai-fill" class="primary">解析</button>
          <button id="btn-stop-fill" class="secondary" disabled>停止</button>
        </div>
        <div class="targets-scroll">
          <table class="assets-table">
            <thead>
              <tr>
                <th>#</th>
                <th>当前文件名</th>
                <th>目标文件名（可编辑，扩展名固定）</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="targets-body"></tbody>
          </table>
        </div>
        <div class="actions">
          <span id="target-summary" class="hint"></span>
          <span id="run-hint" class="hint" role="status"></span>
          <button id="btn-undo" class="secondary" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" d="M15 7H5.06l2.97-2.97l-1.06-1.06l-3.895 3.895a1.26 1.26 0 0 0 0 1.77L6.97 12.53l1.06-1.06L5.06 8.5H15c2.48 0 4.5 2.02 4.5 4.5s-2.02 4.5-4.5 4.5H7V19h8c3.31 0 6-2.69 6-6s-2.69-6-6-6" /></svg>
          撤销</button>
        <button id="btn-redo" class="secondary" disabled>
          <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24" aria-hidden="true"><path d="M0 0h24v24H0z" fill="none" /><path fill="currentColor" d="M20.925 6.865L17.03 2.97l-1.06 1.06L18.94 7H9c-3.31 0-6 2.69-6 6s2.69 6 6 6h8v-1.5H9c-2.48 0-4.5-2.02-4.5-4.5S6.52 8.5 9 8.5h9.94l-2.97 2.97l1.06 1.06l3.895-3.895a1.26 1.26 0 0 0 0-1.77" /></svg>
          重做</button>
          <button id="btn-clear-targets" class="secondary">清空列表</button>
          <button id="btn-execute" class="danger">开始重命名</button>
        </div>
      </section>
    </main>

    <!-- ③ 模板设置 dialog -->
    <dialog id="template-dialog" class="app-dialog">
      <form method="dialog" id="template-form">
        <h2>模板设置</h2>
        <label class="field">
          <span>
            模板（示例 <code>{人物}-{场景}-{动作}-{日夜}</code>，值由视觉模型以中文提取）
          </span>
          <input
            id="template-pattern"
            type="text"
            placeholder="{人物}-{场景}-{动作}-{日夜}"
          />
        </label>
        <div class="field">
          <span>推荐字段（点击插入到模板）</span>
          <div id="field-chips" class="chip-list"></div>
        </div>
        <div class="field">
          <span>当前模板字段（输入即更新）</span>
          <ul id="template-fields" class="chip-list"></ul>
        </div>
        <div id="template-preview" class="template-preview"></div>
        <div class="actions">
          <button id="btn-save-template" class="primary">保存</button>
          <button id="btn-cancel-template" class="secondary" type="button">取消</button>
          <span id="template-hint" class="hint" role="status"></span>
        </div>
      </form>
    </dialog>

    <!-- ④ 模型设置 dialog -->
    <dialog id="model-dialog" class="app-dialog">
      <form method="dialog" id="model-form">
        <h2>模型设置</h2>
        <label class="field">
          <span>API Base URL</span>
          <input id="model-base-url" type="url" placeholder="https://api.openai.com/v1" />
        </label>
        <label class="field">
          <span>API Key</span>
          <input id="model-api-key" type="password" placeholder="sk-..." />
        </label>
        <div class="field">
          <span>模型（可下拉选择或直接输入；⟳ 从 API 拉取列表）</span>
          <span class="input-row">
            <input
              id="model-name"
              type="text"
              list="model-options"
              placeholder="gpt-4o"
              autocomplete="off"
            />
            <button
              type="button"
              id="btn-load-models"
              class="icon-btn"
              title="从 API 拉取可用模型列表"
              aria-label="加载模型列表"
            >
              ⟳
            </button>
          </span>
          <datalist id="model-options"></datalist>
        </div>
        <label class="field">
          <span>超时（秒）</span>
          <input id="model-timeout" type="number" min="10" max="600" value="60" />
        </label>
        <div class="actions">
          <button id="btn-save-config" class="primary" value="save">保存</button>
          <button id="btn-cancel-config" class="secondary" value="cancel">取消</button>
          <span id="config-hint" class="hint" role="status"></span>
        </div>
      </form>
    </dialog>

    <!-- ⑤ 重命名日志 dialog -->
    <dialog id="logs-dialog" class="app-dialog">
      <div class="dialog-body">
        <h2>重命名日志</h2>
        <div class="row">
          <button id="btn-refresh-log" class="secondary">刷新</button>
          <button id="btn-open-log" class="secondary">打开日志目录</button>
          <span id="log-summary" class="hint"></span>
        </div>
        <ul id="log-list" class="log-list"></ul>
        <div class="actions">
          <button id="btn-close-logs" class="secondary" type="button">关闭</button>
        </div>
      </div>
    </dialog>

    <!-- hover 原文件名的图片预览弹层 -->
    <div id="img-preview" class="img-preview" hidden>
      <img id="img-preview-img" alt="预览" />
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
