[package]
name = "llmrename"
version = "0.1.0"
description = "Visual-model-driven batch image renamer"
edition = "2021"
rust-version = "1.77"

[lib]
name = "llmrename_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
base64 = "0.22"
open = "5"
rfd = "0.15"

[dev-dependencies]
tempfile = "3"